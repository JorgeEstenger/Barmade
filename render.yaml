# Blueprint for the BarMade backend in JorgeEstenger/Barmade (code at the repo root).
# Data is stored in Neon PostgreSQL: set DATABASE_URL in the Render dashboard
# (Environment) to the Neon connection string. Without it the API runs in memory.
services:
  - type: web
    name: barmade-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
