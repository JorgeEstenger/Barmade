# Blueprint for the BarMade backend in JorgeEstenger/Barmade (code at the repo root).
# The API runs on Render and persists its demo data in Cloud Firestore.
services:
  - type: web
    name: barmade-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: FIRESTORE_PROJECT_ID
        value: barmade1-7be2b
      # Paste the complete, minified service-account JSON in Render.
      # Keep it secret and never commit it to the repository.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
